<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JalSaafi — Swarm Coordination</title>
<style>
  :root{--deep:#0e4a68;--signal:#25d0c0;--signal-dim:#14827a;--warn:#f2b134;--ink:#dff1ef;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--deep);
    font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;color:var(--ink)}
  #app{position:relative;width:100vw;height:100vh}
  canvas{display:block}
  .panel{position:absolute;background:rgba(4,26,40,.82);
    border:1px solid rgba(37,208,192,.28);backdrop-filter:blur(9px);
    border-radius:10px;padding:14px 16px}
  #title{top:18px;left:18px;padding:16px 20px}
  #title h1{font-size:19px;letter-spacing:.14em;font-weight:600;color:#fff;
    display:flex;align-items:center;gap:10px}
  #title h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--signal);
    box-shadow:0 0 10px var(--signal);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  #title .sub{margin-top:6px;font-size:10.5px;letter-spacing:.22em;
    color:var(--signal-dim);text-transform:uppercase}

  #stats{top:18px;right:18px;min-width:210px}
  #stats .row{display:flex;justify-content:space-between;align-items:baseline;
    padding:5px 0;font-size:11.5px}
  #stats .row + .row{border-top:1px solid rgba(37,208,192,.12)}
  #stats .k{color:#8fb7c4;text-transform:uppercase;font-size:9.5px;letter-spacing:.14em}
  #stats .v{color:#fff;font-variant-numeric:tabular-nums;font-size:14px}
  #stats .v.big{color:var(--signal);font-size:20px;font-weight:600}

  #fleet{bottom:18px;left:18px;width:290px}
  #fleet .hd{font-size:9.5px;letter-spacing:.2em;color:var(--signal-dim);
    text-transform:uppercase;margin-bottom:10px}
  .bot-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:11px}
  .bot-row + .bot-row{border-top:1px solid rgba(37,208,192,.1)}
  .bot-row .chip{width:12px;height:12px;border-radius:3px;flex-shrink:0}
  .bot-row .name{width:54px;color:#cfe6ea}
  .bot-row .task{flex:1;color:#8fb7c4;font-size:10px}
  .bot-row .load{font-variant-numeric:tabular-nums;color:var(--warn);font-size:10px}

  #ctrl{bottom:18px;right:18px;width:250px}
  #ctrl .hd{font-size:9.5px;letter-spacing:.2em;color:var(--signal-dim);
    text-transform:uppercase;margin-bottom:12px}
  .ctl{margin-bottom:13px}
  .ctl label{display:flex;justify-content:space-between;font-size:10.5px;
    color:#9fc2cd;margin-bottom:5px}
  .ctl label b{color:var(--signal);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;-webkit-appearance:none;height:4px;border-radius:2px;
    background:rgba(37,208,192,.2);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
    border-radius:50%;background:var(--signal);cursor:pointer;box-shadow:0 0 8px rgba(37,208,192,.6)}
  .btns{display:flex;gap:8px}
  button{flex:1;background:rgba(37,208,192,.1);border:1px solid rgba(37,208,192,.35);
    color:var(--signal);font-family:inherit;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;padding:9px 6px;border-radius:7px;cursor:pointer;transition:.15s}
  button:hover{background:rgba(37,208,192,.22)}
  button.active{background:var(--signal);color:#04202f;font-weight:600}
  .seg{display:flex;gap:6px;margin-bottom:13px}
  .hint{font-size:9px;color:#5d8291;margin-top:6px;line-height:1.4}
  @media(max-width:820px){#fleet,#ctrl{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="title" class="panel">
    <h1><span class="dot"></span>JALSAAFI SWARM</h1>
    <div class="sub">Multi-Agent Coordination · Auto Task Allocation</div>
  </div>

  <div id="stats" class="panel">
    <div class="row"><span class="k">Oil recovered</span><span class="v big" id="s-recovered">0.0 L</span></div>
    <div class="row"><span class="k">Active slicks</span><span class="v" id="s-slicks">0</span></div>
    <div class="row"><span class="k">Fleet size</span><span class="v" id="s-fleet">4</span></div>
    <div class="row"><span class="k">Coverage</span><span class="v" id="s-cov">0%</span></div>
    <div class="row"><span class="k">Mission time</span><span class="v" id="s-time">0.0 s</span></div>
  </div>

  <div id="fleet" class="panel">
    <div class="hd">Fleet status · live assignment</div>
    <div id="fleet-rows"></div>
  </div>

  <div id="ctrl" class="panel">
    <div class="hd">Controls</div>
    <div class="seg" id="strategy">
      <button data-s="balanced" class="active">Load-balanced</button>
      <button data-s="nearest">Nearest-only</button>
    </div>
    <div class="ctl">
      <label>Fleet size <b id="v-fleet">4</b></label>
      <input type="range" id="r-fleet" min="1" max="6" step="1" value="4">
    </div>
    <div class="ctl">
      <label>Spill rate <b id="v-rate">1.0×</b></label>
      <input type="range" id="r-rate" min="0" max="3" step="0.1" value="1">
    </div>
    <div class="btns">
      <button id="b-spawn">+ Spill</button>
      <button id="b-reset">Reset</button>
      <button id="b-pause">Pause</button>
    </div>
    <div class="hint">Bots share the map and divide slicks between themselves by distance + current workload — no bot double-books a slick.</div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" }}
</script>
<script type="module">
import * as THREE from 'three';

const app=document.getElementById('app');
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x0a3a52,0.0035);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,2000);
camera.position.set(0,190,180); camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xbfe4ff,0x2a5568,1.0));
const sun=new THREE.DirectionalLight(0xfff8ec,1.4);
sun.position.set(120,200,80); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-260;sun.shadow.camera.right=260;
sun.shadow.camera.top=260;sun.shadow.camera.bottom=-260;sun.shadow.camera.far=600;
scene.add(sun);

// ---- water ----
const WORLD=240;
const waterGeo=new THREE.PlaneGeometry(WORLD,WORLD,120,120); waterGeo.rotateX(-Math.PI/2);
const water=new THREE.Mesh(waterGeo,new THREE.MeshStandardMaterial({
  color:0x2a93c4,metalness:0.1,roughness:0.85,transparent:true,opacity:1}));
water.receiveShadow=true; scene.add(water);
const basePos=waterGeo.attributes.position.array.slice();
const grid=new THREE.GridHelper(WORLD,40,0x0d5a80,0x0a3d59);
grid.position.y=-0.4; grid.material.opacity=0.25; grid.material.transparent=true; scene.add(grid);

// base station (where bots launch from)
const base=new THREE.Mesh(new THREE.CylinderGeometry(8,10,3,6),
  new THREE.MeshStandardMaterial({color:0x14827a,metalness:0.4,roughness:0.5,emissive:0x14827a,emissiveIntensity:0.3}));
base.position.set(0,1.5,-WORLD*0.4); base.castShadow=true; scene.add(base);

// ---- bot factory ----
const BOT_COLORS=[0xff5a1f,0x25d0c0,0xf2b134,0xff3d9a,0x8b5cf6,0x4ade80];
const BOT_NAMES=['BOT-01','BOT-02','BOT-03','BOT-04','BOT-05','BOT-06'];
function makeBot(color){
  const g=new THREE.Group();
  const hullMat=new THREE.MeshStandardMaterial({color,metalness:0.2,roughness:0.5,emissive:color,emissiveIntensity:0.25});
  const deckMat=new THREE.MeshStandardMaterial({color:0xffffff,metalness:0.3,roughness:0.4});
  for(const s of [-1,1]){
    const pon=new THREE.Mesh(new THREE.CapsuleGeometry(1.1,7,8,16),hullMat);
    pon.rotation.x=Math.PI/2; pon.position.set(s*2.4,1.1,0); pon.castShadow=true; g.add(pon);
  }
  const deck=new THREE.Mesh(new THREE.BoxGeometry(6,0.8,7),deckMat);
  deck.position.y=2.2; deck.castShadow=true; g.add(deck);
  const bow=new THREE.Mesh(new THREE.ConeGeometry(1.3,3,4),
    new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:0.6}));
  bow.rotation.x=Math.PI/2; bow.position.set(0,2.4,4.5); g.add(bow);
  const mast=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,6,8),
    new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:0.8}));
  mast.position.y=5.5; g.add(mast);
  const beacon=new THREE.Mesh(new THREE.SphereGeometry(1.1,16,16),
    new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:1.6}));
  beacon.position.y=9; g.add(beacon);
  const skim=new THREE.Mesh(new THREE.RingGeometry(5.4,6,40).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.4,side:THREE.DoubleSide}));
  skim.position.y=0.6; g.add(skim);
  g.scale.setScalar(2.4);
  scene.add(g);
  return {group:g, beacon, color};
}

// ---- spills ----
const spills=[];
const oilMat=()=>new THREE.MeshStandardMaterial({color:0x000000,metalness:0.1,roughness:0.65});
function spawnSpill(x,z,volume){
  x=x??(Math.random()-0.5)*WORLD*0.85;
  z=z??(Math.random()-0.5)*WORLD*0.85;
  volume=volume??(18+Math.random()*45);
  const radius=Math.sqrt(volume)*2.1;
  const g=new THREE.Group(); g.position.set(x,0,z);
  const blob=new THREE.Group();
  const n=5+(volume/8|0);
  for(let i=0;i<n;i++){
    const rr=radius*(0.35+Math.random()*0.55);
    const disc=new THREE.Mesh(new THREE.CircleGeometry(rr,20).rotateX(-Math.PI/2),oilMat());
    disc.position.set((Math.random()-0.5)*radius,1.1+Math.random()*0.15,(Math.random()-0.5)*radius);
    blob.add(disc);
  }
  g.add(blob);
  const sheen=new THREE.Mesh(new THREE.RingGeometry(radius*0.92,radius*1.12,40).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({color:0xff3d9a,transparent:true,opacity:0.8,side:THREE.DoubleSide}));
  sheen.position.y=1.0; g.add(sheen);
  scene.add(g);
  spills.push({group:g,blob,x,z,volume,radius,initVolume:volume,assignedTo:null});
}

// ---- FLEET ----
let bots=[];       // {mesh, x,z,heading, target, route[], recovered}
function buildFleet(n){
  bots.forEach(b=>scene.remove(b.mesh.group));
  bots=[];
  for(let i=0;i<n;i++){
    const mesh=makeBot(BOT_COLORS[i]);
    bots.push({mesh, name:BOT_NAMES[i], color:BOT_COLORS[i],
      x:(i-(n-1)/2)*14, z:-WORLD*0.4+14, heading:0,
      target:null, route:[], recovered:0});
  }
}

// route lines per bot
const routeLines=[];
function ensureRouteLines(){
  routeLines.forEach(l=>scene.remove(l));
  routeLines.length=0;
  bots.forEach(b=>{
    const l=new THREE.Line(new THREE.BufferGeometry(),
      new THREE.LineBasicMaterial({color:b.color,transparent:true,opacity:0.5}));
    scene.add(l); routeLines.push(l);
  });
}

// ---------------------------------------------------------------------------
// COORDINATION — the swarm decision algorithm
// Each frame: clear assignments, then greedily assign every slick to the bot
// that is "cheapest" for it = distance + workload penalty. This spreads load
// so bots don't all chase the same slick.
// ---------------------------------------------------------------------------
let strategy='balanced';
function coordinate(){
  bots.forEach(b=>{b.route=[];});
  spills.forEach(s=>s.assignedTo=null);
  // workload = running sum of volume already assigned to each bot
  const load=bots.map(()=>0);
  // sort slicks biggest first so big ones get assigned to freest bots
  const order=spills.slice().sort((a,b)=>b.volume-a.volume);
  for(const s of order){
    let best=-1,bestCost=Infinity;
    for(let i=0;i<bots.length;i++){
      const b=bots[i];
      const d=Math.hypot(s.x-b.x,s.z-b.z);
      // balanced: distance + workload penalty; nearest: distance only
      const cost = strategy==='balanced' ? d + load[i]*1.4 : d;
      if(cost<bestCost){bestCost=cost;best=i;}
    }
    s.assignedTo=best;
    load[best]+=s.volume;
    bots[best].route.push(s);
  }
  // each bot orders its own route greedily (nearest-next from itself)
  bots.forEach(b=>{
    const rem=b.route.slice(); const ordered=[]; let cx=b.x,cz=b.z;
    while(rem.length){
      let bi=0,bd=Infinity;
      for(let i=0;i<rem.length;i++){const d=Math.hypot(rem[i].x-cx,rem[i].z-cz); if(d<bd){bd=d;bi=i;}}
      const s=rem.splice(bi,1)[0]; ordered.push(s); cx=s.x; cz=s.z;
    }
    b.route=ordered; b.target=ordered[0]||null;
  });
}

// ---- metrics/state ----
const M={recovered:0,time:0,paused:false};
let rateMul=1, spawnTimer=0;

// ---- controls ----
const $=id=>document.getElementById(id);
$('r-rate').oninput=e=>{rateMul=+e.target.value;$('v-rate').textContent=rateMul.toFixed(1)+'×';};
$('r-fleet').oninput=e=>{const n=+e.target.value;$('v-fleet').textContent=n;$('s-fleet').textContent=n;buildFleet(n);ensureRouteLines();};
$('b-spawn').onclick=()=>spawnSpill();
$('b-reset').onclick=()=>{spills.forEach(s=>scene.remove(s.group));spills.length=0;M.recovered=0;M.time=0;bots.forEach(b=>b.recovered=0);};
$('b-pause').onclick=e=>{M.paused=!M.paused;e.target.textContent=M.paused?'Resume':'Pause';e.target.classList.toggle('active',M.paused);};
document.querySelectorAll('#strategy button').forEach(b=>{
  b.onclick=()=>{document.querySelectorAll('#strategy button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); strategy=b.dataset.s;};
});

buildFleet(4); ensureRouteLines();
for(let i=0;i<8;i++) spawnSpill();

// ---- loop ----
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  // water ripple
  const p=waterGeo.attributes.position;
  for(let i=0;i<p.count;i++){const ix=i*3;const x=basePos[ix],z=basePos[ix+2];
    p.array[ix+1]=Math.sin(x*0.05+t*0.8)*0.25+Math.cos(z*0.06+t*0.7)*0.22;}
  p.needsUpdate=true;

  if(!M.paused){
    M.time+=dt;
    spawnTimer-=dt*rateMul;
    if(spawnTimer<=0 && spills.length<32){spawnSpill();spawnTimer=2.8+Math.random()*2.5;}
    coordinate();

    // move each bot toward its target
    for(const b of bots){
      if(!b.target){ continue; }
      const dx=b.target.x-b.x, dz=b.target.z-b.z, dist=Math.hypot(dx,dz);
      const desired=Math.atan2(dx,dz);
      let dh=desired-b.heading; while(dh>Math.PI)dh-=2*Math.PI; while(dh<-Math.PI)dh+=2*Math.PI;
      b.heading+=dh*Math.min(1,dt*4);
      const step=Math.min(dist,24*dt);
      b.x+=Math.sin(b.heading)*step; b.z+=Math.cos(b.heading)*step;
      // clean
      if(dist<b.target.radius+6){
        const s=b.target, before=s.volume;
        s.volume=Math.max(0,s.volume-22*dt);
        const got=before-s.volume; M.recovered+=got; b.recovered+=got;
        const k=Math.max(0.04,s.volume/s.initVolume);
        s.blob.scale.setScalar(k);
        s.group.children.forEach(c=>{if(c.material&&c.material.transparent!==false)c.material.opacity=0.8*Math.max(k,0.15);});
        if(s.volume<=0.4){scene.remove(s.group);spills.splice(spills.indexOf(s),1);}
      }
    }
  }

  // apply transforms + draw routes
  bots.forEach((b,i)=>{
    b.mesh.group.position.set(b.x,1.4+Math.sin(t*2+i)*0.3,b.z);
    b.mesh.group.rotation.y=b.heading;
    b.mesh.beacon.material.emissiveIntensity=1.2+Math.sin(t*6+i)*0.5;
    const pts=[new THREE.Vector3(b.x,2,b.z)];
    b.route.forEach(s=>pts.push(new THREE.Vector3(s.x,2,s.z)));
    routeLines[i].geometry.dispose();
    routeLines[i].geometry=new THREE.BufferGeometry().setFromPoints(pts);
  });

  // camera slow orbit
  const camR=235,camA=t*0.04;
  camera.position.x=Math.sin(camA)*camR; camera.position.z=Math.cos(camA)*camR;
  camera.position.y=155+Math.sin(t*0.1)*18;
  camera.lookAt(0,0,0);

  updateHUD();
  renderer.render(scene,camera);
}

function updateHUD(){
  $('s-recovered').textContent=M.recovered.toFixed(1)+' L';
  $('s-slicks').textContent=spills.length;
  $('s-time').textContent=M.time.toFixed(1)+' s';
  const totalVol=spills.reduce((a,s)=>a+s.volume,0);
  $('s-cov').textContent=Math.round(M.recovered/(M.recovered+totalVol+0.0001)*100)+'%';
  const rows=$('fleet-rows'); rows.innerHTML='';
  bots.forEach(b=>{
    const hex='#'+b.color.toString(16).padStart(6,'0');
    const task=b.target?`→ slick ${b.target.volume.toFixed(0)}L · queue ${b.route.length}`:'idle · patrolling';
    const el=document.createElement('div'); el.className='bot-row';
    el.innerHTML=`<span class="chip" style="background:${hex}"></span>
      <span class="name">${b.name}</span>
      <span class="task">${task}</span>
      <span class="load">${b.recovered.toFixed(0)}L</span>`;
    rows.appendChild(el);
  });
}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
animate();
</script>
</body>
</html>
